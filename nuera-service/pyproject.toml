[tool.poetry]
name = "nuera-service"
version = "0.1.0"
description = "Real-time audio transcription service using OpenAI's Whisper model"
authors = ["Your Name <your.email@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "0.104.1"
uvicorn = "0.24.0"
python-multipart = "0.0.6"
numpy = "1.24.3"
torch = "2.1.1"
openai-whisper = "20231117"
ffmpeg-python = "0.2.0"
scipy = "1.11.3"
websockets = "12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3 