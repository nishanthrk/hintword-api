name: Deploy to EC2

on:
  push:
    branches: [ release/hintword ]
  pull_request:
    branches: [ release/hintword ]

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: hintword-api
  EC2_INSTANCE_IP: ${{ secrets.EC2_INSTANCE_IP }}

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        mask-aws-account-id: true

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build a docker container and push it to ECR
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f Dockerfile.hintword .
        echo "Pushing image to ECR..."
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "registry=$ECR_REGISTRY" >> $GITHUB_OUTPUT
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        # Detect key type and add appropriate markers
        if [[ "${{ secrets.SSH_PRIVATE_KEY }}" == *"OPENSSH"* ]]; then
          echo "-----BEGIN OPENSSH PRIVATE KEY-----" > ~/.ssh/private_key
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr ' ' '\n' >> ~/.ssh/private_key
          echo "-----END OPENSSH PRIVATE KEY-----" >> ~/.ssh/private_key
        else
          echo "-----BEGIN RSA PRIVATE KEY-----" > ~/.ssh/private_key
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr ' ' '\n' >> ~/.ssh/private_key
          echo "-----END RSA PRIVATE KEY-----" >> ~/.ssh/private_key
        fi
        chmod 600 ~/.ssh/private_key
        eval $(ssh-agent -s)
        ssh-add ~/.ssh/private_key
        # Properly setup known hosts with the actual host key
        ssh-keyscan -H ${{ secrets.EC2_INSTANCE_IP }} >> ~/.ssh/known_hosts 2>/dev/null
        chmod 600 ~/.ssh/known_hosts

    - name: Deploy to EC2
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        # First SSH connection to setup dependencies
        ssh -i ~/.ssh/private_key ubuntu@${{ secrets.EC2_INSTANCE_IP }} "\
          # Install Docker if not present
          if ! command -v docker &> /dev/null; then \
            echo 'Installing Docker...' && \
            sudo apt-get update && \
            sudo apt-get install -y docker.io && \
            sudo systemctl start docker && \
            sudo systemctl enable docker && \
            sudo usermod -aG docker ubuntu && \
            echo 'Docker installed and user added to docker group'; \
          fi && \
          # Install AWS CLI if not present
          if ! command -v aws &> /dev/null; then \
            echo 'Installing AWS CLI...' && \
            sudo apt-get install -y unzip && \
            curl 'https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip' -o 'awscliv2.zip' && \
            unzip -q awscliv2.zip && \
            sudo ./aws/install && \
            rm -rf aws awscliv2.zip; \
          fi && \
          # Create hintword directory and .env file
          mkdir -p ~/hintword && \
          echo '${{ secrets.ENV_FILE_CONTENT }}' > ~/hintword/.env && \
          chmod 600 ~/hintword/.env"

        # Second SSH connection with a fresh session to ensure docker group membership
        ssh -i ~/.ssh/private_key ubuntu@${{ secrets.EC2_INSTANCE_IP }} "\
          # Configure AWS credentials
          mkdir -p ~/.aws && \
          echo '[default]' > ~/.aws/credentials && \
          echo 'aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}' >> ~/.aws/credentials && \
          echo 'aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}' >> ~/.aws/credentials && \
          echo '[default]' > ~/.aws/config && \
          echo 'region=${{ env.AWS_REGION }}' >> ~/.aws/config && \
          # Login to ECR and pull the image
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | sudo docker login --username AWS --password-stdin $ECR_REGISTRY && \
          sudo docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest && \
          # Stop and remove existing container if it exists
          sudo docker stop hintword-api || true && \
          sudo docker rm hintword-api || true && \
          # Run the new container
          sudo docker run -d \
            --name hintword-api \
            -p 9099:9099 \
            -v ~/hintword/.env:/hintword-api/.env \
            --restart unless-stopped \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest"

    - name: Cleanup
      if: always()
      run: rm -f ~/.ssh/private_key 